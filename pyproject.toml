[project]
name = "mpy-debugpy"
version = "0.1.0"
description = "mbm integration + tooling for debugging MicroPython over the Debug Adapter Protocol"
requires-python = ">=3.10"

[project.optional-dependencies]
# Host-side DAP test harness dependencies (see Makefile `test`).
# pyserial + platformdirs: transitively required to import mpremote
# (test_s4_1_debugpy_install.py, test_s5_1_mpremote_debug.py).
test = ["pytest", "anyio", "debugpy", "pyserial", "platformdirs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [
    # Upstream trees, carrying upstream's own style and lint rules.
    "micropython",
    "micropython-lib",
    # Vendored benchmark, kept byte-identical to the original.
    "src/pystone.py",
]

[tool.ruff.lint.per-file-ignores]
# T100/T201: the DAP client/tests intentionally use debug-adjacent patterns.
# E402: tests put the mpremote/launcher directories on sys.path before
# importing from them, so their imports cannot all sit at the top of the file.
"tests/*" = ["T100", "T201", "E402"]
# Device-side sample debuggees: unused locals and the lambda are the point -
# they exist so a debug session has something to inspect.
"src/*" = ["F841", "E731"]
