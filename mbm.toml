# micropython-branch-manager (mbm)
# Install: pip install micropython-branch-manager
#          or: uv tool install micropython-branch-manager
# Usage:   mbm --help
#
# This file DRIVES `mbm rebase` (run via `make integrate`); `make bootstrap`
# stays checkout-only. Composed branches are pushed to the andrewleech forks
# (andrewleech/micropython @ mpy-debugpy, andrewleech/micropython-lib @
# mpy-debugpy). A branch entry without `pr_number` whose `pr_url` is a fork
# `/tree/` URL is local-only: mbm uses the pre-existing local branch of that
# name as-is, so it must exist locally in the submodule (and be pushed to the
# fork for provenance) before running `mbm rebase`.
#
# D6 scoping: per-decision, ampremote mpremote branches are registered here
# only when the EPIC-4/5 ticket that needs them starts. verify_hash (#18436,
# renamed mpremote_file_cp_hash) is registered for STORY-4.1, alongside that
# story's own mpremote_debugpy_install; QEMU PTY #18327, reconnect #17322,
# rfc2217 #19062, fast transfer #18785 remain unregistered.

[[submodules]]
path = "micropython"
integration_branch = "mpy-debugpy"

[[submodules.branches]]
name = "pdb_support"
pr_url = "https://github.com/micropython/micropython/pull/8767"
pr_number = 8767
title = "sys.settrace: gettrace, _getframe, f_trace support (PR #8767)"

[[submodules.branches]]
name = "local_names_implementation"
pr_url = "https://github.com/andrewleech/micropython/tree/local_names_implementation"
title = "frame.f_locals with real local names + placeholder fallback"

[[submodules.branches]]
name = "settrace_loop_line_events"
pr_url = "https://github.com/andrewleech/micropython/tree/settrace_loop_line_events"
title = "py/vm: Fire settrace line events on backward jumps, not FOR_ITER"

[[submodules.branches]]
name = "debug_board_flags"
pr_url = "https://github.com/andrewleech/micropython/tree/debug_board_flags"
title = "Enable sys.settrace on the RPI_PICO_W, PYBD_SF6, ESP32_GENERIC debug-firmware build targets"

[[submodules.branches]]
name = "mpremote_file_cp_hash"
pr_url = "https://github.com/micropython/micropython/pull/18436"
pr_number = 18436
title = "tools/mpremote: Add streaming hash verification to file transfers"

[[submodules.branches]]
name = "mpremote_close_lost_device"
pr_url = "https://github.com/andrewleech/micropython/tree/mpremote_close_lost_device"
title = "tools/mpremote: Close the serial port even if clearing RTS/DTR fails"

[[submodules.branches]]
name = "mpremote_debugpy_install"
pr_url = "https://github.com/andrewleech/micropython/tree/mpremote_debugpy_install"
title = "tools/mpremote: Add cached, cross-compiled debugpy package installer"

[[submodules.branches]]
name = "unix_stdin_read_error"
pr_url = "https://github.com/andrewleech/micropython/tree/unix_stdin_read_error"
title = "unix/unix_mphal: Report a failed stdin read as end of input"

# The `debug` work is three stacked branches, and only the tip is registered.
# `mpremote_dap_repl` contains `mpremote_debug_command`, which contains
# `mpremote_transport_fixes`, so composing the tip alone yields the identical
# tree. Registering all three does NOT work: mbm rebases each branch
# independently onto the target, so the tip's rebase mints different SHAs for
# the same commits the middle branch already contributed, and merging both
# replays every change twice - measured 2026-08-25, a six-file conflict across
# commands.py, main.py, dap_log.py, mpdebug_config.py, mpy_launch_debugpy.py
# and the docs. It only appears when the target differs from the branches'
# existing base, so a pinned-target rebuild will not show it.
#
# The other two branches are kept, unregistered, because upstream wants them as
# three stacked PRs in that order (the middle one calls a `read_until`
# parameter the first one adds). They supersede `mpremote_debug`, which
# predates the split and carries none of the review fixes.
[[submodules.branches]]
name = "mpremote_dap_repl"
pr_url = "https://github.com/andrewleech/micropython/tree/mpremote_dap_repl"
title = "tools/mpremote: Add the debug command, over TCP and over the REPL stream"

[[submodules]]
path = "micropython-lib"
integration_branch = "mpy-debugpy"

[[submodules.branches]]
name = "add-debugpy-support"
pr_url = "https://github.com/micropython/micropython-lib/pull/1022"
pr_number = 1022
title = "debugpy DAP server (PR #1022)"

# `mpy-debugpy-foundations` was registered here and is deliberately not any
# more (2026-08-22). Its commits were folded onto `add-debugpy-support` on
# 2026-08-10, so composing both replays the same changes twice: the merge
# conflicts across 11 files, and `make integrate` cannot complete for this
# submodule. Measured rather than assumed - rebuilding without it succeeds and
# leaves `python-ecosys/debugpy/` byte-identical to rebuilding with it, and
# identical to `add-debugpy-support` itself. The branch still exists locally
# and as tag `safety-20260822/mpy-debugpy-foundations`; nothing it carries is
# lost by leaving it out, and it reached no PR to begin with.

