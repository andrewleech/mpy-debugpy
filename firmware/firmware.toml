# Firmware provenance manifest (STORY-3.1/3.2).
#
# Each [[variant]] describes one prebuilt binary, cached locally under
# firmware/<id>/ once fetched. Capability fields here are what the *build* was
# intended to provide; they are not a substitute for runtime capability probing
# (STORY-1.2) and must never be inferred from a directory or variant name alone
# (see planning/BACKGROUND.md, "Firmware (C) internals" and planning/ROADMAP.md
# STORY-3.1/3.3). A claimed-true-but-probed-false capability is a hard error
# (launcher/capcheck.py).
#
# `source_commit` is the exact commit the binary was built from, recoverable
# from the `MicroPython vX.Y.Z[-preview].g<sha>` version string embedded in each
# artifact (readable via `strings <binary> | grep MicroPython`). It tracks the
# last composition that changed firmware sources, so it lags the submodule pin
# whenever a pin move touches only host-side code under tools/mpremote -
# republishing there would mint a new tag for firmware differing solely in its
# embedded build date and sha. Check `git diff <source_commit> <pin> --
# . ':(exclude)tools/mpremote'` before concluding the manifest is stale.
#
# Entries are produced by CI (.github/workflows/firmware.yml): each Release
# tagged fw-<micropython-sha10> carries the four artifacts, a checksums file,
# and the assembled manifest fragments this file is updated from
# (launcher/gen_manifest.py). `deprecated = true` marks an entry as a
# provenance record only - `launcher/firmware.py select` excludes it from the
# candidate pool regardless of its capability claims.
#
# The four legacy pre-recomposition entries (unix-settrace-save-names and
# friends, Josverl-lineage builds with drifted provenance) were dropped when
# the first CI Release replaced them; git history preserves them (see the
# s3.3/s3.2 tickets).

[[variant]]
id = "esp32-generic-debug"
deprecated = false
description = "esp32 port, BOARD=ESP32_GENERIC, sys.settrace enabled with real local variable names. Merged flash-from-0 image (bootloader + partition table + application)."
repo = "https://github.com/andrewleech/micropython.git"
source_commit = "7c8dd9c90eb66cfdbd6d09cef00a589f0607dabb"
port = "esp32"
board = "ESP32_GENERIC"
build_flags = [
    "MICROPY_PY_SYS_SETTRACE=1",
    "MICROPY_PY_SYS_SETTRACE_LOCALNAMES=1",
]
capabilities = { set_local = false, f_back = true, settrace = true, save_names = true }
capabilities_note = "Flags committed in boards/ESP32_GENERIC/mpconfigboard.h on the debug_board_flags composition branch, not passed via CFLAGS_EXTRA."
artifact = "esp32-generic-debug/firmware.bin"
artifact_sha256 = "a833f43e936aea042d060df5f4cd72e7027b216019e6af6bb3b1dba9964c8f38"
download_url = "https://github.com/andrewleech/mpy-debugpy/releases/download/fw-7c8dd9c90e/firmware-ESP32_GENERIC.bin"
notes = "Built with ESP-IDF v5.3 (espressif/idf:v5.3 container image, pinned by digest in the toolchain table)."
toolchain = { idf_ver = "v5.3", gcc = "xtensa-esp-elf-gcc (crosstool-NG esp-13.2.0_20240530) 13.2.0", container_image = "espressif/idf:v5.3@sha256:89df2532b2f5df278a8cca6a06358f6e615628aabeb0f7e639e27646a23208d7", ci_run_id = "35947195711", ci_run_attempt = "1" }

